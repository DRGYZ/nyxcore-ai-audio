name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev]"

      - name: Run backend tests
        run: |
          pytest

  frontend:
    name: Frontend Tests & Build (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web
          npm ci --engine-strict

      - name: Run frontend tests
        run: |
          cd web
          npm test

      - name: Run frontend build
        run: |
          cd web
          npm run build

  preview:
    name: Package Review-Only Preview
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install FFmpeg for synthetic audio
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build preview ZIP and verify checksum
        run: |
          python scripts/build_preview.py
          cd dist/preview
          sha256sum --check "nyxcore-review-preview-${{ github.sha }}.zip.sha256"

      - name: Upload preview ZIP and checksum
        uses: actions/upload-artifact@v7
        with:
          name: nyxcore-review-preview-${{ github.sha }}
          path: |
            dist/preview/nyxcore-review-preview-${{ github.sha }}.zip
            dist/preview/nyxcore-review-preview-${{ github.sha }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
